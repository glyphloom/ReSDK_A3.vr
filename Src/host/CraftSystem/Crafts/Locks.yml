- name: Простой замок с ключом
  type: default
  category: Other
  options:
    station: locks
    skill_bonus: -2
    craft_duration: "10"
  required:
    skills: {engineering: 10}
    components:
      - {class: 'MetalDebris(1-2)', count: 1, check_type_of: false}
      - {class: Hammer, destroy: false}
      - {class: Screwdriver, destroy: false}
      - {class: Key, optional: true, destroy: false}
  result: {class: DoorLock}

- name: Прочный замок с ключом
  type: default
  category: Other
  options:
    station: locks
    skill_bonus: -1
    craft_duration: "15"
  required:
    skills: {engineering: 13}
    components:
      - {class: 'MetalDebris(1-2)', count: 2, check_type_of: false}
      - {class: Hammer, destroy: false}
      - {class: Screwdriver, destroy: false}
      - {class: Key, optional: true, destroy: false}
  result: {class: StrongDoorLock}

- name: Дубликат ключа
  type: default
  category: Other
  options:
    station: locks
    craft_duration: "15"
  required:
    skills: {engineering: 10}
    components:
      - {class: 'MetalDebris(1-2)', count: 1, check_type_of: false}
      - {class: Key, destroy: false}
      - {class: Candle, destroy: false, condition: lightIsEnabled}
  result: {class: Key}
